add_newline = false
command_timeout = 1000

format = "$kubernetes$aws$gcloud$all"

[line_break]
disabled = true

[aws]
disabled = false
symbol = 'A:'
format = '| [$symbol$profile]($style) '
force_display = true
[aws.profile_aliases]
m3pay-dev = 'dev'
m3pay-qa = 'qa'
'm3pay-prod(read)' = 'prod(read)'
'm3pay-prod(admin)' = 'prod(admin)'

[gcloud]
disabled = false
symbol = "G:"
format = '| [$symbol$project]($style) '

[golang]
symbol = " "
disabled = true

[directory]
truncation_length = 80
truncation_symbol = ""
style = "white"

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "purple"

[git_status]
disabled = false

# [git_metrics]
# disabled = false
# added_style = "green"
# deleted_style = "red"

[kubernetes]
disabled=false
format = '[$symbol$context]($style) '
symbol = "k:"
contexts = [
  { context_pattern = "satoki-(.*)@(.*)", context_alias = "satoki-$1" },
  ]

[gradle]
disabled = true

[java]
disabled = true

[bun]
disabled = true

[package]
disabled = true

[nodejs]
symbol = ' '
format = '[$symbol($version)]($style) '

[kotlin]
disabled = true

[terraform]
disabled = true

[rust]
disabled = true

[docker_context]
disabled = true
